# Controlled backend experiment template; see README.md.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  namespace: configpilot-lab
  name: retry-budget
spec:
  hosts:
  - complex-retry-budget.audit.invalid
  gateways:
  - default/bookinfo-gateway
  http:
  - name: tested
    match:
    - uri:
        prefix: /test/
    route:
    - destination:
        host: backend-0
        port:
          number: 80
    rewrite:
      uri: /received/tested/
    headers:
      request:
        set:
          x-source: tested
        remove:
        - x-secret
      response:
        set:
          x-policy: tested
    retries:
      attempts: 2
      retryOn: 5xx
      perTryTimeout: 250ms
    timeout: 500ms
