# Controlled backend experiment template; see README.md.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  namespace: configpilot-lab
  name: connection-pool
spec:
  hosts:
  - complex-pool.audit.invalid
  gateways:
  - default/bookinfo-gateway
  http:
  - name: tested
    match:
    - uri:
        prefix: /test/
    route:
    - destination:
        host: backend-0
        port:
          number: 80
    rewrite:
      uri: /received/tested/
    headers:
      request:
        set:
          x-source: tested
        remove:
        - x-secret
      response:
        set:
          x-policy: tested
    retries:
      attempts: 0
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: pool
  namespace: configpilot-lab
spec:
  host: backend-0
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
