<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三层空间配置依赖图</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        :root {
            --bg: #151515;
            --panel: #1b1d21;
            --panel-2: #212427;
            --line: #3c3f42;
            --text: #f0f0f0;
            --muted: #b8bbbe;
            --accent: #73bcf7;
            --ok: #5ba352;
            --warn: #f0ab00;
            --bad: #c46162;
            --layer1: #73bcf7;
            --layer2: #5ba352;
            --layer3: #f0ab00;
            --radius: 3px;
            --font: "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text); overflow: hidden;
            font-size: 13px;
        }
        .app { display: flex; height: 100vh; }
        .left, .right {
            background: var(--panel);
            display: flex; flex-direction: column;
            min-height: 0;
        }
        .left {
            width: 248px; border-right: 1px solid var(--line);
            padding: 14px 12px; overflow-y: auto; flex-shrink: 0;
        }
        .right {
            width: 320px; border-left: 1px solid var(--line);
            flex-shrink: 0;
        }
        .center { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
        @media (max-width: 900px) {
            .right { display: none; }
            .left { width: 190px; }
        }
        .toolbar {
            background: var(--panel);
            padding: 6px 12px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            border-bottom: 1px solid var(--line); min-height: 40px;
        }
        .toolbar .hint { color: var(--muted); font-size: 12px; flex: 1; min-width: 120px; }
        #cy {
            flex: 1; position: relative;
            background-color: #151515;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        h1 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
        .sub kbd {
            background: var(--bg); border: 1px solid var(--line);
            border-radius: 2px; padding: 0 4px; font-size: 10px; color: var(--text);
        }
        .search-wrap { position: relative; margin-bottom: 10px; }
        .search-wrap input {
            width: 100%; background: var(--bg); color: var(--text);
            border: 1px solid var(--line); border-radius: var(--radius);
            padding: 6px 8px 6px 28px; font-size: 13px; outline: none; font-family: inherit;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-icon {
            position: absolute; left: 8px; top: 7px; color: var(--muted); font-size: 12px;
            pointer-events: none;
        }
        .search-drop {
            display: none; position: absolute; left: 0; right: 0; top: 100%;
            z-index: 20; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: var(--radius); margin-top: 2px; max-height: 260px; overflow-y: auto;
        }
        .search-drop.open { display: block; }
        .search-item {
            width: 100%; text-align: left; background: transparent; border: 0;
            color: var(--text); padding: 7px 8px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: inherit;
        }
        .search-item:hover, .search-item.active { background: #2c3034; }
        .search-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stat { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
        .stat span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
        .filter-group { margin: 12px 0 0; }
        .filter-group label {
            display: block; font-size: 12px; color: var(--muted);
            margin-bottom: 4px;
        }
        select, .file-input input {
            width: 100%; padding: 6px 8px; background: var(--bg);
            border: 1px solid var(--line); color: var(--text); border-radius: var(--radius);
            font-size: 12px; font-family: inherit;
        }
        select:focus, .search-wrap input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(115,188,247,0.28);
        }
        .check {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--muted); margin-top: 8px; cursor: pointer;
        }
        .check input { width: auto; accent-color: var(--accent); }
        .btn {
            padding: 6px 10px; background: var(--accent); color: #151515; border: 1px solid transparent;
            border-radius: var(--radius); cursor: pointer; font-size: 12px; white-space: nowrap;
            font-weight: 600; font-family: inherit;
        }
        .btn:hover { background: #8bc7f8; }
        .btn:disabled { opacity: 0.45; cursor: default; }
        .btn.secondary { background: var(--panel-2); color: var(--text); border-color: var(--line); }
        .btn.secondary:hover { background: #2c3034; }
        .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
        .btn.ghost.on { border-color: var(--accent); color: var(--accent); background: #1b2834; }
        .btn.danger { background: #2b1c1c; color: #f0b4b4; border-color: #5c2b2b; }
        .left .btn { width: 100%; margin-top: 8px; }
        .legend { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
        .legend h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; color: var(--muted); }
        .legend-dot { width: 10px; height: 10px; border-radius: 1px; flex-shrink: 0; }
        .crumb {
            display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
            font-size: 12px; color: var(--muted); padding: 8px 12px;
            border-bottom: 1px solid var(--line); min-height: 36px;
            background: var(--panel);
        }
        .crumb button {
            background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px;
            max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-family: inherit;
        }
        .crumb button:hover { color: var(--accent); }
        .crumb .now { color: var(--text); }
        .inspector { flex: 1; overflow-y: auto; padding: 12px 12px 20px; }
        .empty {
            color: var(--muted); font-size: 13px; line-height: 1.55; padding: 16px 4px;
        }
        .empty kbd {
            background: var(--bg); border: 1px solid var(--line);
            border-radius: 2px; padding: 1px 4px; font-size: 11px; color: var(--text);
        }
        .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .tag {
            font-size: 11px; padding: 1px 6px; border-radius: var(--radius);
            border: 1px solid var(--line); color: var(--muted);
        }
        .tag.layer1 { color: var(--layer1); border-color: #3a5870; background: #1b2834; }
        .tag.layer2 { color: var(--layer2); border-color: #2d4a2d; background: #1c2b1c; }
        .tag.layer3 { color: var(--layer3); border-color: #5c4a1c; background: #2b2618; }
        .tag.control_plane { color: var(--layer1); border-color: #3a5870; }
        .tag.data_plane { color: #f0b4b4; border-color: #5c2b2b; }
        .tag.ok { color: var(--ok); border-color: #2d4a2d; background: #1c2b1c; }
        .tag.bad { color: #f0b4b4; border-color: #5c2b2b; background: #2b1c1c; }
        .tag.warn { color: var(--warn); border-color: #5c4a1c; }
        .insp-title {
            font-size: 15px; font-weight: 600; line-height: 1.35; margin: 4px 0 10px;
            word-break: break-word;
        }
        .kv { display: grid; grid-template-columns: 72px 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 12px; }
        .kv dt { color: var(--muted); }
        .kv dd { word-break: break-all; }
        .sec-title {
            font-size: 12px; color: var(--muted);
            margin: 14px 0 6px; font-weight: 600;
        }
        .conn {
            display: block; width: 100%; text-align: left;
            background: var(--bg); border: 1px solid var(--line);
            color: var(--text); border-radius: var(--radius); padding: 7px 8px;
            margin-bottom: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
        }
        .conn:hover { border-color: var(--accent); background: var(--panel-2); }
        .conn .dir { color: var(--accent); margin-right: 6px; }
        .conn .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
        .insp-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
        .insp-actions .btn { width: auto; margin: 0; }
        #tooltip {
            display: none; position: fixed; z-index: 40; pointer-events: none;
            background: var(--panel-2); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 6px 8px; font-size: 12px; max-width: 280px;
        }
        #tooltip .t-name { font-weight: 600; margin-bottom: 2px; }
        #tooltip .t-meta { color: var(--muted); font-size: 11px; }
        .help {
            display: none; position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,0.55); align-items: center; justify-content: center;
        }
        .help.open { display: flex; }
        .help-card {
            background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
            padding: 16px 18px; width: min(400px, 92vw);
        }
        .help-card h2 { font-size: 15px; margin-bottom: 10px; font-weight: 600; }
        .help-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; color: var(--muted); }
        .help-row span:last-child { color: var(--text); }
        .path-banner {
            display: none; align-items: center; gap: 8px;
            background: #1b2834; border-bottom: 1px solid #2b4a66;
            padding: 6px 12px; font-size: 12px; color: var(--accent);
        }
        .path-banner.on { display: flex; }
        .issue-banner {
            display: none; align-items: center; gap: 10px; flex-wrap: wrap;
            background: #2b1c1c; border-bottom: 1px solid #5c2b2b;
            padding: 6px 12px; font-size: 12px; color: #f0b4b4;
        }
        .issue-banner.on { display: flex; }
        .issue-banner strong { color: #f0f0f0; }
        .issue-list { margin-top: 12px; }
        .issue-list h3 { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
        .issue-card {
            display: block; width: 100%; text-align: left; cursor: pointer;
            background: #2b1c1c; border: 1px solid #5c2b2b;
            border-radius: var(--radius); padding: 7px 8px; margin-bottom: 6px; color: var(--text);
            font-family: inherit;
        }
        .issue-card:hover { border-color: #c46162; }
        .issue-card .sev { font-size: 11px; color: #f0b4b4; margin-bottom: 2px; }
        .issue-card .sev.medium { color: var(--warn); }
        .issue-card .ttl { font-size: 12px; font-weight: 600; }
        .issue-card .desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
        .cy-wrap { flex: 1; position: relative; min-height: 0; }
        #cy { position: absolute; inset: 0; flex: none; }
        #issue-pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .issue-pin {
            pointer-events: auto; position: absolute; width: 16px; height: 16px;
            margin-left: -8px; margin-top: -22px; border-radius: 2px;
            background: #c9190b; color: #fff; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #f0b4b4;
            cursor: pointer;
        }
        .issue-pin.medium { background: #f0ab00; color: #151515; border-color: #f0ab00; }
        .insp-issues { margin: 0 0 10px; }
        .insp-issue {
            background: #2b1c1c; border-left: 3px solid var(--bad);
            padding: 7px 8px; margin-bottom: 6px; font-size: 12px;
        }
        .insp-issue.warn { border-left-color: var(--warn); background: #2b2618; }
    </style>
</head>
<body>
    <div class="app">
        <aside class="left">
            <h1>三层配置依赖图</h1>
            <p class="sub">搜索定位节点，点击查看邻域与关联服务。按 <kbd style="color:var(--text)">?</kbd> 看快捷键。</p>
            <div class="search-wrap" id="search-wrap">
                <span class="search-icon">⌕</span>
                <input id="search-input" type="search" placeholder="搜索节点 / 服务 / 资源…" autocomplete="off">
                <div id="search-drop" class="search-drop"></div>
            </div>
            <div class="stat"><span>节点</span><span id="node-count">0</span></div>
            <div class="stat"><span>边</span><span id="edge-count">0</span></div>
            <div class="stat"><span>不一致</span><span id="bad-count">0</span></div>
            <div class="filter-group">
                <label>命名空间</label>
                <select id="ns-filter">
                    <option value="all">全部</option>
                </select>
            </div>
            <div class="filter-group">
                <label>显示层级</label>
                <select id="layer-filter">
                    <option value="all">全部</option>
                    <option value="layer1">第一层 · 控制面 / 数据面</option>
                    <option value="layer2">第二层 · 服务关系</option>
                    <option value="layer3">第三层 · 配置资源</option>
                    <option value="cross_layer">跨层边</option>
                </select>
            </div>
            <div class="filter-group">
                <label>平面类型</label>
                <select id="plane-filter">
                    <option value="all">全部</option>
                    <option value="control_plane">控制面</option>
                    <option value="data_plane">数据面</option>
                </select>
            </div>
            <label class="check"><input type="checkbox" id="config-only" checked> 只显示有配置资源的节点</label>
            <label class="check"><input type="checkbox" id="inconsistent-only"> 仅看不一致边及其端点</label>
            <div class="issue-list" id="issue-list"></div>
            <button class="btn" type="button" onclick="fitGraph()">适应视图</button>
            <button class="btn secondary" type="button" onclick="relayoutGraph()">重新布局</button>
            <button class="btn secondary" type="button" onclick="resetView()">重置筛选</button>
            <button class="btn ghost" type="button" id="path-btn" onclick="togglePathMode()">路径查找</button>
            <div class="file-input filter-group">
                <label>加载 JSON</label>
                <input type="file" id="file-input" accept=".json">
            </div>
            <div class="legend">
                <h3>图例</h3>
                <div class="legend-item"><div class="legend-dot" style="background:var(--layer1);color:var(--layer1)"></div>第一层 全局</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--layer2);color:var(--layer2)"></div>第二层 服务</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--layer3);color:var(--layer3)"></div>第三层 配置</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--bad);color:var(--bad)"></div>不一致匹配</div>
                <div class="legend-item"><div class="legend-dot" style="background:#8a8d90;border-radius:0;height:3px;width:16px"></div>Exp 控制面期望权重</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--bad);color:var(--bad);border-radius:0;height:3px;width:16px;box-shadow:none"></div>Obs 数据面实测权重</div>
            </div>
        </aside>
        <div class="center">
            <div class="toolbar">
                <span class="hint" id="data-source">正在加载图数据…</span>
                <button class="btn ghost" type="button" onclick="toggleHelp()">快捷键</button>
                <button class="btn secondary" type="button" onclick="exportPNG()">导出 PNG</button>
            </div>
            <div class="path-banner" id="path-banner">路径模式：再点一个节点作为终点</div>
            <div class="issue-banner" id="issue-banner"></div>
            <div class="cy-wrap">
                <div id="cy"></div>
                <div id="issue-pins"></div>
            </div>
        </div>
        <aside class="right">
            <div class="crumb" id="crumb">未选中节点</div>
            <div class="inspector" id="inspector"></div>
        </aside>
    </div>
    <div id="tooltip"></div>
    <div class="help" id="help" onclick="if(event.target===this)toggleHelp()">
        <div class="help-card">
            <h2>快捷键</h2>
            <div class="help-row"><span>搜索</span><span>/ 或 Ctrl+K</span></div>
            <div class="help-row"><span>适应视图</span><span>F</span></div>
            <div class="help-row"><span>清除选中 / 路径</span><span>Esc</span></div>
            <div class="help-row"><span>聚焦邻域</span><span>双击节点</span></div>
            <div class="help-row"><span>路径查找</span><span>P，再点两个节点</span></div>
            <div class="help-row"><span>本面板</span><span>? 或 H</span></div>
            <div style="margin-top:14px;text-align:right"><button class="btn secondary" type="button" onclick="toggleHelp()">关闭</button></div>
        </div>
    </div>

    <script>
        let cy = null;
        let graphData = null;
        let selectedId = null;
        let focusMode = false;
        let pathMode = false;
        let pathStart = null;
        let historyIds = [];
        let searchHits = [];
        let searchIndex = 0;

        const LAYER_NAME = {
            layer1: "第一层 · 全局",
            layer2: "第二层 · 服务",
            layer3: "第三层 · 配置",
            cross_layer: "跨层",
            box: "分组"
        };
        const PLANE_NAME = {
            control_plane: "控制面",
            data_plane: "数据面",
            consistency_checker: "一致性检查"
        };
        const RES_NAME = { VS: "VirtualService", DR: "DestinationRule", EF: "EnvoyFilter", RLS: "RateLimitService", SE: "ServiceEntry" };
        const REL_NAME = {
            route: "路由", rate_limit: "限流", traffic_split: "流量分配",
            circuit_breaker: "熔断", gateway: "网关", references: "引用"
        };
        const MATCH_NAME = { consistent: "一致", inconsistent: "不一致", partial: "部分一致", unknown: "未知" };

        function $(id) { return document.getElementById(id); }
        function escapeHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function isBox(n) {
            const d = n.data ? n.data() : n;
            return !!(d.isParent || d.layer === "box");
        }
        function typeLabel(d) {
            return RES_NAME[d.resource_type] || d.resource_type || d.node_type || d.layer || "-";
        }

        let liveNamespaces = [];

        async function loadLiveNamespaces() {
            try {
                const res = await fetch("/api/namespaces");
                const data = await res.json();
                liveNamespaces = data.namespaces || [];
            } catch (e) {
                liveNamespaces = [];
            }
            fillNamespaceFilter();
        }

        function fillNamespaceFilter() {
            const sel = $("ns-filter");
            if (!sel) return;
            const fromUrl = new URLSearchParams(location.search).get("namespace");
            const current = (fromUrl && fromUrl !== "all") ? fromUrl : (sel.value || "all");
            const fromGraph = ((graphData && graphData.metadata) || {}).namespaces || [];
            const live = new Set(liveNamespaces);
            let names = fromGraph.length ? fromGraph.slice() : liveNamespaces.slice();
            fromGraph.forEach(function (n) {
                if (n && names.indexOf(n) < 0 && (!live.size || live.has(n))) names.push(n);
            });
            sel.innerHTML = '<option value="all">全部</option>' + names.map(function (n) {
                return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + "</option>";
            }).join("");
            if (fromUrl && (fromUrl === "all" || names.indexOf(fromUrl) >= 0)) sel.value = fromUrl;
            else if (fromGraph.length === 1) sel.value = fromGraph[0];
            else sel.value = (current === "all" || names.indexOf(current) >= 0) ? current : "all";
        }

        document.getElementById("file-input").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    graphData = JSON.parse(ev.target.result);
                    initGraph();
                    $("data-source").textContent = "已加载: " + file.name;
                } catch (err) {
                    $("data-source").textContent = "JSON 解析失败: " + err.message;
                }
            };
            reader.readAsText(file);
        });

        async function loadFromUrl() {
            const params = new URLSearchParams(location.search);
            const reportId = params.get("report_id") || params.get("report");
            const url = params.get("url");
            const candidates = [];
            if (url) candidates.push(url);
            if (reportId) candidates.push("/api/three_layer_graph/" + encodeURIComponent(reportId));
            candidates.push("/api/three_layer_graph/latest");
            candidates.push("/static/output_three_layer_graph.json");

            for (const fetchUrl of candidates) {
                try {
                    const res = await fetch(fetchUrl, {headers: params.get("demo") === "1" ? {"X-ConfigPilot-Demo": "1"} : {}});
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data.error || !data.nodes) continue;
                    graphData = data;
                    initGraph();
                    $("data-source").textContent = params.get("demo") === "1" ? "演示数据 · 模拟结果" : "已加载: " + (reportId || fetchUrl);
                    return;
                } catch (e) {
                    console.warn("加载失败", fetchUrl, e);
                }
            }
            $("data-source").textContent = "未找到图数据。请先生成三层图，或在左侧加载 JSON。";
            renderInspector(null);
        }
        loadLiveNamespaces();
        loadFromUrl();

        window.addEventListener("resize", function () {
            if (!cy) return;
            cy.resize();
            cy.fit(50);
        });
        window.addEventListener("message", function (e) {
            const msg = e.data || {};
            if (msg.type === "configpilot-reload") loadFromUrl();

        let canvasObserver = null;
        let layoutPending = false;

        function observeCanvasSize() {
            const el = document.getElementById("cy");
            if (!el || typeof ResizeObserver === "undefined") return;
            if (canvasObserver) canvasObserver.disconnect();
            canvasObserver = new ResizeObserver(function () {
                if (!cy) return;
                cy.resize();
                if (el.clientWidth > 40 && el.clientHeight > 40) {
                    if (layoutPending) relayoutGraph();
                }
            });
            canvasObserver.observe(el);
        }

        function bindCyEvents() {
            cy.on("tap", "node", function (evt) {
                const node = evt.target;
                if (pathMode) {
                    handlePathPick(node);
                    return;
                }
                selectNode(node, { fromHistory: false });
            });
            cy.on("tap", "edge", function (evt) {
                const edge = evt.target;
                const src = edge.source();
                selectNode(src, { fromHistory: false });
                highlightPath(edge.connectedNodes().union(edge));
            });
            cy.on("tap", function (evt) {
                if (evt.target === cy) clearSelection();
            });
            cy.on("dbltap", "node", function (evt) {
                focusMode = true;
                selectNode(evt.target, { fromHistory: false, isolate: true });
            });
            cy.on("mouseover", "node", function (evt) {
                cy.nodes().removeClass("hover");
                evt.target.addClass("hover");
                showTooltip(evt);
                if (!selectedId && !pathMode && !isBox(evt.target)) previewNeighborhood(evt.target);
            });
            cy.on("mousemove", "node", showTooltip);
            cy.on("mouseout", "node", function (evt) {
                evt.target.removeClass("hover");
                hideTooltip();
                if (!selectedId && !pathMode) clearHighlight();
            });
            cy.on("pan zoom", updateIssuePins);
            cy.on("render", updateIssuePins);
        }

        function nodeList(coll) {
            const out = [];
            if (!coll) return out;
            coll.forEach(function (n) { out.push(n); });
            return out;
        }

        function bboxOf(nodes) {
            if (!nodes.length) return { x1: 0, y1: 0, x2: 0, y2: 0, w: 0, h: 0 };
            const bb = cy.collection(nodes).boundingBox({ includeLabels: false, includeOverlays: false });
            return { x1: bb.x1, y1: bb.y1, x2: bb.x2, y2: bb.y2, w: bb.w, h: bb.h };
        }

        function shiftNodes(nodes, dx, dy) {
            if (!nodes.length || (!dx && !dy)) return;
            cy.collection(nodes).shift({ x: dx, y: dy });
        }

        function packLeaves(nodes, originX, originY) {
            const layer2 = [];
            const layer3 = [];
            nodes.forEach(function (n) {
                if (n.data("layer") === "layer3") layer3.push(n);
                else layer2.push(n);
            });
            const byLabel = function (a, b) {
                return String(a.data("label") || a.id()).localeCompare(String(b.data("label") || b.id()));
            };
            layer2.sort(byLabel);
            layer3.sort(byLabel);

            const CELL_W = 82;
            const CELL_H = 64;

            function grid(list, x0, y0, maxCols) {
                if (!list.length) return { w: 0, h: 0, rows: 0 };
                const cols = Math.min(Math.max(1, maxCols), list.length);
                const rows = Math.ceil(list.length / cols);
                list.forEach(function (node, i) {
                    const c = i % cols;
                    const r = Math.floor(i / cols);
                    node.position({ x: x0 + c * CELL_W, y: y0 + r * CELL_H });
                });
                return { w: (cols - 1) * CELL_W, h: (rows - 1) * CELL_H, rows: rows };
            }

            const r2 = grid(layer2, originX, originY, layer2.length <= 2 ? layer2.length : 3);
            const y3 = originY + (layer2.length ? r2.h + CELL_H + 18 : 0);
            const r3 = grid(layer3, originX, y3, layer3.length <= 3 ? Math.max(1, layer3.length) : 4);
            const w = Math.max(r2.w, r3.w, 48);
            const h = (layer3.length ? y3 + r3.h : originY + r2.h) - originY;
            return { width: w, height: Math.max(h, 24) };
        }

        function collectPlaneGroups(planeId) {
            const plane = cy.getElementById(planeId);
            const groups = [];
            if (!plane.length) return groups;

            const direct = [];
            plane.children().forEach(function (child) {
                if (child.data("layer") === "box") {
                    const leaves = nodeList(child.descendants().filter(function (n) {
                        return !n.isParent() && n.style("display") !== "none";
                    }));
                    if (leaves.length) {
                        groups.push({
                            name: child.data("label") || child.id(),
                            nodes: leaves
                        });
                    }
                } else if (!child.isParent() && child.style("display") !== "none") {
                    direct.push(child);
                }
            });
            if (direct.length) {
                groups.unshift({ name: "_", nodes: direct });
            }
            groups.sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
            return groups;
        }

        function layoutGroupGrid(groups, originX, originY) {
            if (!groups.length) return [];
            const placed = groups.map(function (g) {
                packLeaves(g.nodes, 0, 0);
                return { g: g, bb: bboxOf(g.nodes) };
            });
            const colsN = placed.length > 5 ? 2 : 1;
            const colW = [0, 0];
            placed.forEach(function (item, i) {
                const c = i % colsN;
                colW[c] = Math.max(colW[c], item.bb.w);
            });
            const GAP_X = 56;
            const GAP_Y = 64;
            let y = originY;
            for (let i = 0; i < placed.length; i += colsN) {
                const row = placed.slice(i, i + colsN);
                const rowH = Math.max.apply(null, row.map(function (item) { return item.bb.h; }));
                let x = originX;
                row.forEach(function (item, c) {
                    shiftNodes(item.g.nodes, x - item.bb.x1, y - item.bb.y1);
                    x += colW[c] + GAP_X;
                });
                y += rowH + GAP_Y;
            }
            return groups.reduce(function (acc, g) { return acc.concat(g.nodes); }, []);
        }

        function layoutStructured() {
            if (!cy) return;
            const el = document.getElementById("cy");
            if (el && (el.clientWidth < 40 || el.clientHeight < 40)) {
                layoutPending = true;
                return;
            }
            layoutPending = false;

            cy.batch(function () {
                const cpLeaves = layoutGroupGrid(collectPlaneGroups("control_plane"), 0, 0);
                const dpLeaves = layoutGroupGrid(collectPlaneGroups("data_plane"), 0, 0);
                const cpBB = bboxOf(cpLeaves);
                const dpBB = bboxOf(dpLeaves);
                const GAP = 240;
                if (cpLeaves.length) {
                    shiftNodes(cpLeaves, -GAP / 2 - cpBB.x2, -(cpBB.y1 + cpBB.y2) / 2);
                }
                if (dpLeaves.length) {
                    shiftNodes(dpLeaves, GAP / 2 - dpBB.x1, -(dpBB.y1 + dpBB.y2) / 2);
                }

                const cc = cy.getElementById("consistency_checker");
                if (cc.length) {
                    const ccKids = nodeList(cc.descendants().filter(function (n) { return !n.isParent(); }));
                    if (ccKids.length) {
                        packLeaves(ccKids, 0, 0);
                        const bb = bboxOf(ccKids);
                        const topY = Math.min(
                            cpLeaves.length ? bboxOf(cpLeaves).y1 : 0,
                            dpLeaves.length ? bboxOf(dpLeaves).y1 : 0
                        );
                        shiftNodes(ccKids, - (bb.x1 + bb.x2) / 2, topY - 90 - bb.y2);
                    } else {
                        const topY = Math.min(
                            cpLeaves.length ? bboxOf(cpLeaves).y1 : 0,
                            dpLeaves.length ? bboxOf(dpLeaves).y1 : 0
                        );
                        cc.position({ x: 0, y: topY - 70 });
                    }
                }
            });
        }

        function relayoutGraph(opts) {
            opts = opts || {};
            if (!cy) return;
            cy.resize();
            layoutStructured();
            if (layoutPending) return;
            cy.fit(56);
            updateIssuePins();
        }

        function neighborhoodOf(node) {
            const ego = node.closedNeighborhood();
            return ego.union(node.ancestors()).union(node.descendants());
        }

        function previewNeighborhood(node) {
            const ego = neighborhoodOf(node);
            cy.batch(function () {
                cy.elements().removeClass("faded highlighted");
                cy.elements().not(ego).addClass("faded");
                ego.addClass("highlighted");
            });
        }

        function highlightNeighborhood(node, isolate) {
            const ego = neighborhoodOf(node);
            cy.batch(function () {
                cy.elements().removeClass("faded highlighted path-hl");
                if (isolate) {
                    cy.elements().style("display", "element");
                    applyFilters();
                    cy.elements().not(ego).forEach(function (el) {
                        if (!el.isNode() || !el.isParent()) el.style("display", "none");
                    });
                    ego.style("display", "element");
                } else {
                    cy.elements().not(ego).addClass("faded");
                    ego.addClass("highlighted");
                }
            });
        }

        function highlightPath(eles) {
            cy.batch(function () {
                cy.elements().removeClass("faded highlighted path-hl");
                cy.elements().not(eles).addClass("faded");
                eles.addClass("highlighted path-hl");
            });
        }

        function clearHighlight() {
            if (!cy) return;
            cy.elements().removeClass("faded highlighted path-hl search-hit");
        }

        function selectNode(node, opts) {
            opts = opts || {};
            if (!node || !node.length) return;
            selectedId = node.id();
            cy.$(":selected").unselect();
            node.select();
            if (!opts.fromHistory) pushHistory(selectedId);
            highlightNeighborhood(node, opts.isolate || focusMode);
            renderInspector(node);
            renderCrumb();
        }

        function locateNode(id, opts) {
            if (!cy) return;
            const node = cy.getElementById(id);
            if (!node.length) return;
            focusMode = !!(opts && opts.focus);
            selectNode(node, { fromHistory: !!(opts && opts.fromHistory), isolate: focusMode });
            cy.animate({ fit: { eles: neighborhoodOf(node), padding: 80 } }, { duration: 420, easing: "ease-out-cubic" });
        }

        function clearSelection() {
            selectedId = null;
            focusMode = false;
            pathStart = null;
            if (cy) {
                cy.$(":selected").unselect();
                clearHighlight();
                applyFilters();
            }
            renderInspector(null);
            renderCrumb();
        }

        function pushHistory(id) {
            if (historyIds[historyIds.length - 1] === id) return;
            historyIds.push(id);
            if (historyIds.length > 8) historyIds = historyIds.slice(-8);
        }

        function renderCrumb() {
            const el = $("crumb");
            if (!historyIds.length || !cy) {
                el.textContent = "未选中节点";
                return;
            }
            const items = historyIds.slice(-4).map(function (id, i, arr) {
                const n = cy.getElementById(id);
                const name = n.length ? (n.data("label") || id) : id;
                const cls = i === arr.length - 1 ? "now" : "";
                return '<button type="button" class="' + cls + '" data-id="' + escapeHtml(id) + '">' + escapeHtml(name) + "</button>";
            });
            el.innerHTML = items.join('<span style="color:#243044">›</span>');
            el.querySelectorAll("button").forEach(function (btn) {
                btn.onclick = function () { locateNode(btn.getAttribute("data-id"), { fromHistory: true }); };
            });
        }

        function connectionsOf(node) {
            const edges = node.connectedEdges();
            const list = [];
            edges.forEach(function (edge) {
                const outgoing = edge.source().id() === node.id();
                const other = outgoing ? edge.target() : edge.source();
                if (isBox(other) && other.id() !== "consistency_checker") return;
                list.push({
                    edge: edge,
                    outgoing: outgoing,
                    other: other,
                    relation: edge.data("relation_type") || edge.data("match_type") || edge.data("layer"),
                    label: edge.data("label") || "",
                    match: edge.data("match_type") || "",
                    layer: edge.data("layer") || ""
                });
            });
            return list;
        }

        function renderInspector(node) {
            const box = $("inspector");
            box.classList.remove("flash");
            void box.offsetWidth;
            box.classList.add("flash");
            if (!node || !node.length) {
                box.innerHTML = '<div class="empty">点击图中的节点查看详情。<br><br>支持：邻域高亮、关联跳转、路径查找。<br><br>快捷键 <kbd>/</kbd> 搜索，<kbd>F</kbd> 适应视图，<kbd>Esc</kbd> 清除。</div>';
                return;
            }
            const d = node.data();
            const conns = connectionsOf(node);
            const services = [];
            const configs = [];
            conns.forEach(function (c) {
                const od = c.other.data();
                if (od.layer === "layer2" || od.node_type === "service") services.push(c);
                if (od.layer === "layer3" || od.resource_type) configs.push(c);
            });
            const badges = [
                '<span class="tag ' + escapeHtml(d.layer || "") + '">' + escapeHtml(LAYER_NAME[d.layer] || d.layer || "节点") + "</span>"
            ];
            if (d.plane_type) badges.push('<span class="tag ' + escapeHtml(d.plane_type) + '">' + escapeHtml(PLANE_NAME[d.plane_type] || d.plane_type) + "</span>");
            if (d.node_type) badges.push('<span class="tag">' + escapeHtml(d.node_type) + "</span>");
            if (d.resource_type) badges.push('<span class="tag">' + escapeHtml(RES_NAME[d.resource_type] || d.resource_type) + "</span>");

            let html = '<div class="badges">' + badges.join("") + "</div>";
            html += '<div class="insp-title">' + escapeHtml(d.label || d.id) + "</div>";
            html += '<div class="insp-actions">';
            html += '<button class="btn ghost' + (focusMode ? " on" : "") + '" type="button" id="btn-focus">' + (focusMode ? "取消聚焦" : "聚焦邻域") + "</button>";
            html += '<button class="btn ghost" type="button" id="btn-fit-n">定位到图</button>';
            html += "</div>";
            html += "<dl class='kv'>";
            html += "<dt>ID</dt><dd>" + escapeHtml(d.id) + "</dd>";
            if (d.service_name) html += "<dt>服务</dt><dd>" + escapeHtml(d.service_name) + "</dd>";
            if (d.namespace) html += "<dt>命名空间</dt><dd>" + escapeHtml(d.namespace) + "</dd>";
            if (d.config_name) html += "<dt>配置名</dt><dd>" + escapeHtml(d.config_name) + "</dd>";
            html += "<dt>类型</dt><dd>" + escapeHtml(typeLabel(d)) + "</dd>";
            html += "<dt>连接</dt><dd>" + conns.length + "</dd>";
            html += "</dl>";

            const nodeIssues = d.issues || [];
            if (d.has_issue && nodeIssues.length) {
                html += '<div class="insp-issues">';
                nodeIssues.forEach(function (iss) {
                    html += '<div class="insp-issue' + (iss.severity === "medium" ? " warn" : "") + '">';
                    html += "<strong>" + escapeHtml(iss.title || iss.type || "不一致") + "</strong>";
                    if (iss.description) html += "<div style='margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45'>" + escapeHtml(iss.description) + "</div>";
                    const full = ((graphData && graphData.issues) || []).filter(function (x) { return x.id === iss.id; })[0] || iss;
                    if (full.expected || full.observed) {
                        html += "<div style='margin-top:6px;font-size:11px'>";
                        if (full.expected) html += "<div style='color:#c5d0e0'>Exp " + escapeHtml(formatWeightMap(full.expected)) + "</div>";
                        if (full.observed) html += "<div style='color:#ffb4b8'>Obs " + escapeHtml(formatWeightMap(full.observed)) + "</div>";
                        html += "</div>";
                    }
                    html += "</div>";
                });
                html += "</div>";
            }

            if (node.isParent()) {
                const kids = node.children().filter(function (n) {
                    return n.data("layer") !== "box";
                });
                if (kids.length) {
                    html += '<div class="sec-title">包含 (' + kids.length + ")</div>";
                    kids.forEach(function (child) {
                        const cd = child.data();
                        html += '<button class="conn" type="button" data-id="' + escapeHtml(cd.id) + '">';
                        html += '<span class="dir">' + escapeHtml(cd.resource_type || cd.node_type || cd.layer || "") + "</span>";
                        html += escapeHtml(cd.label || cd.id);
                        html += "</button>";
                    });
                }
            }

            function connBlock(title, items) {
                if (!items.length) return "";
                let s = '<div class="sec-title">' + title + " (" + items.length + ")</div>";
                items.forEach(function (c) {
                    const name = c.other.data("label") || c.other.id();
                    const rel = REL_NAME[c.relation] || MATCH_NAME[c.relation] || c.relation;
                    const arrow = c.outgoing ? "→" : "←";
                    const matchTag = c.match ? '<span class="tag ' + (c.match === "inconsistent" ? "bad" : c.match === "consistent" ? "ok" : "warn") + '">' + escapeHtml(MATCH_NAME[c.match] || c.match) + "</span>" : "";
                    s += '<button class="conn" type="button" data-id="' + escapeHtml(c.other.id()) + '">';
                    s += '<span class="dir">' + arrow + " " + escapeHtml(rel) + "</span>";
                    s += escapeHtml(name);
                    if (c.label) s += '<div class="meta">' + escapeHtml(c.label) + " " + matchTag + "</div>";
                    else if (matchTag) s += '<div class="meta">' + matchTag + "</div>";
                    s += "</button>";
                });
                return s;
            }
            html += connBlock("关联服务", services);
            html += connBlock("关联配置", configs);
            const others = conns.filter(function (c) {
                return services.indexOf(c) < 0 && configs.indexOf(c) < 0;
            });
            html += connBlock("其他连接", others);
            box.innerHTML = html;
            const focusBtn = $("btn-focus");
            if (focusBtn) {
                focusBtn.onclick = function () {
                    focusMode = !focusMode;
                    if (!focusMode) applyFilters();
                    selectNode(node, { fromHistory: true, isolate: focusMode });
                    if (focusMode) cy.animate({ fit: { eles: neighborhoodOf(node), padding: 80 } }, { duration: 300 });
                };
            }
            const fitBtn = $("btn-fit-n");
            if (fitBtn) fitBtn.onclick = function () {
                cy.animate({ fit: { eles: neighborhoodOf(node), padding: 80 } }, { duration: 300 });
            };
            box.querySelectorAll(".conn").forEach(function (btn) {
                btn.onclick = function () { locateNode(btn.getAttribute("data-id")); };
            });
        }

        function showTooltip(evt) {
            const node = evt.target;
            if (!node || !node.isNode || !node.isNode()) return;
            const d = node.data();
            const tip = $("tooltip");
            let meta = (LAYER_NAME[d.layer] || "") + " · " + typeLabel(d) + (d.service_name ? " · " + d.service_name : "");
            if (d.has_issue) {
                const first = (d.issues || [])[0];
                meta += " · 不一致" + (first && first.title ? "：" + first.title : "");
            }
            tip.innerHTML = '<div class="t-name">' + escapeHtml(d.label || d.id) + (d.has_issue ? " ⚠" : "") + "</div>" +
                '<div class="t-meta">' + escapeHtml(meta) + "</div>";
            tip.style.display = "block";
            const rp = evt.renderedPosition || { x: 0, y: 0 };
            const rect = $("cy").getBoundingClientRect();
            tip.style.left = (rect.left + rp.x + 14) + "px";
            tip.style.top = (rect.top + rp.y + 14) + "px";
        }
        function hideTooltip() { $("tooltip").style.display = "none"; }

        function scoreNode(n, q) {
            const d = n.data();
            const id = (d.id || "").toLowerCase();
            const label = (d.label || "").toLowerCase();
            const svc = (d.service_name || "").toLowerCase();
            const type = (d.resource_type || d.node_type || "").toLowerCase();
            if (label === q) return 0;
            if (label.startsWith(q)) return 1;
            if (svc === q) return 2;
            if (id.includes(q)) return 3;
            if (label.includes(q)) return 4;
            if (svc.includes(q)) return 5;
            if (type.includes(q)) return 6;
            return 99;
        }

        function runSearch(q) {
            q = (q || "").trim().toLowerCase();
            const drop = $("search-drop");
            if (!cy || !q) {
                drop.classList.remove("open");
                drop.innerHTML = "";
                searchHits = [];
                if (cy) cy.nodes().removeClass("search-hit");
                return;
            }
            const hits = cy.nodes().filter(function (n) {
                if (isBox(n) && n.id() !== "consistency_checker") return false;
                return scoreNode(n, q) < 99;
            }).sort(function (a, b) { return scoreNode(a, q) - scoreNode(b, q); });
            searchHits = [];
            hits.forEach(function (n) { searchHits.push(n); });
            cy.nodes().removeClass("search-hit");
            searchHits.slice(0, 20).forEach(function (n) { n.addClass("search-hit"); });
            const top = searchHits.slice(0, 8);
            drop.innerHTML = top.map(function (n, i) {
                const d = n.data();
                return '<button class="search-item' + (i === 0 ? " active" : "") + '" type="button" data-id="' + escapeHtml(d.id) + '">' +
                    '<span class="tag ' + escapeHtml(d.layer || "") + '">' + escapeHtml(d.resource_type || d.node_type || d.layer || "") + "</span>" +
                    '<span class="name">' + escapeHtml(d.label || d.id) + "</span></button>";
            }).join("") || '<div class="search-item">无匹配</div>';
            drop.classList.add("open");
            drop.querySelectorAll(".search-item[data-id]").forEach(function (btn) {
                btn.onclick = function () {
                    locateNode(btn.getAttribute("data-id"), { focus: true });
                    drop.classList.remove("open");
                    $("search-input").blur();
                };
            });
        }

        $("search-input").addEventListener("input", function (e) { runSearch(e.target.value); });
        $("search-input").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && searchHits[0]) {
                e.preventDefault();
                locateNode(searchHits[0].id(), { focus: true });
                $("search-drop").classList.remove("open");
            }
            if (e.key === "Escape") {
                $("search-drop").classList.remove("open");
                e.target.blur();
            }
        });
        document.addEventListener("mousedown", function (e) {
            const wrap = $("search-wrap");
            if (wrap && !wrap.contains(e.target)) $("search-drop").classList.remove("open");
        });

        function togglePathMode() {
            pathMode = !pathMode;
            pathStart = null;
            $("path-btn").classList.toggle("on", pathMode);
            $("path-banner").classList.toggle("on", pathMode);
            $("path-banner").textContent = "路径模式：先点起点节点";
            if (!pathMode) {
                cy && cy.elements().removeClass("path-hl");
                if (selectedId) locateNode(selectedId, { fromHistory: true });
                else clearHighlight();
            }
        }
        function handlePathPick(node) {
            if (isBox(node) && node.id() !== "consistency_checker") {
                const kids = node.descendants().filter(function (n) { return !n.isParent(); });
                if (kids.length) node = kids[0];
            }
            if (!pathStart) {
                pathStart = node;
                $("path-banner").textContent = "已选起点 " + (node.data("label") || node.id()) + "，再点终点";
                selectNode(node, { fromHistory: false });
                return;
            }
            const dijkstra = cy.elements().dijkstra({ root: pathStart, directed: false });
            const path = dijkstra.pathTo(node);
            pathMode = false;
            $("path-btn").classList.remove("on");
            $("path-banner").classList.remove("on");
            if (!path || path.length < 2) {
                $("data-source").textContent = "未找到路径：" + (pathStart.data("label") || pathStart.id()) + " → " + (node.data("label") || node.id());
                pathStart = null;
                return;
            }
            highlightPath(path);
            selectNode(node, { fromHistory: false });
            cy.animate({ fit: { eles: path, padding: 70 } }, { duration: 460, easing: "ease-out-cubic" });
            $("data-source").textContent = "路径 " + path.nodes().length + " 个节点 / " + path.edges().length + " 条边";
            pathStart = null;
        }

        function formatWeightMap(m) {
            if (!m) return "";
            return Object.keys(m).map(function (k) { return k + "=" + m[k] + "%"; }).join(" / ");
        }

        function onFilterChange() {
            applyFilters();
            relayoutGraph({ animate: false });
            updateIssuePins();
        }

        function configServiceSet() {
            const set = {};
            if (!cy) return set;
            cy.nodes().forEach(function (n) {
                if (n.data("layer") !== "layer3") return;
                if (n.data("plane_type") && n.data("plane_type") !== "control_plane") return;
                if (n.data("service_name")) set[n.data("service_name")] = true;
            });
            return set;
        }

        function applyFilters() {
            if (!cy) return;
            const layer = $("layer-filter").value;
            const plane = $("plane-filter").value;
            const ns = $("ns-filter") ? $("ns-filter").value : "all";
            const onlyBad = $("inconsistent-only").checked;
            const configOnly = $("config-only") && $("config-only").checked;
            const cfg = configServiceSet();
            const badEdges = cy.edges().filter(function (e) { return e.data("match_type") === "inconsistent"; });
            const badNodes = badEdges.connectedNodes().union(cy.nodes(".has-issue"));

            function leafOk(nd, node) {
                if (nd.isParent || nd.layer === "box") return false;
                if (layer !== "all" && nd.layer !== layer) return false;
                if (plane !== "all" && nd.plane_type && nd.plane_type !== plane) return false;
                if (ns !== "all") {
                    if (["control_plane", "data_plane", "consistency_checker"].indexOf(nd.id) >= 0) return true;
                    if (nd.namespace && nd.namespace !== ns) return false;
                    if (!nd.namespace && nd.layer !== "layer1") return false;
                }
                if (onlyBad && !badNodes.contains(node) && !nd.has_issue) return false;
                if (configOnly) {
                    if (["control_plane", "data_plane", "consistency_checker"].indexOf(nd.id) >= 0) return true;
                    if (nd.node_type === "gateway") return true;
                    if (nd.service_name && cfg[nd.service_name]) return true;
                    return false;
                }
                return true;
            }

            cy.nodes().forEach(function (node) {
                const d = node.data();
                const parentLike = d.isParent || d.layer === "box";
                let show;
                if (parentLike) {
                    const descendants = node.descendants().filter(function (n) { return !n.data("isParent") && n.data("layer") !== "box"; });
                    show = descendants.some(function (n) { return leafOk(n.data(), n); });
                } else {
                    show = leafOk(d, node);
                }
                node.style("display", show ? "element" : "none");
            });
            cy.edges().forEach(function (edge) {
                const d = edge.data();
                const layerMatch = layer === "all" || d.layer === layer;
                const src = cy.getElementById(d.source);
                const tgt = cy.getElementById(d.target);
                const badOk = !onlyBad || d.match_type === "inconsistent" || src.hasClass("has-issue") || tgt.hasClass("has-issue");
                edge.style("display", (layerMatch && badOk && src.visible() && tgt.visible()) ? "element" : "none");
            });
            updateIssuePins();
        }

        function renderIssueList() {
            const box = $("issue-list");
            const banner = $("issue-banner");
            const issues = (graphData && graphData.issues) || [];
            if (!box) return;
            if (!issues.length) {
                box.innerHTML = "";
                if (banner) banner.classList.remove("on");
                return;
            }
            box.innerHTML = "<h3>不一致提示 (" + issues.length + ")</h3>" + issues.map(function (iss) {
                const extra = (iss.expected || iss.observed)
                    ? ("Exp " + formatWeightMap(iss.expected || {}) + " → Obs " + formatWeightMap(iss.observed || {}))
                    : (iss.description || "");
                return '<button class="issue-card" type="button" data-id="' + escapeHtml(iss.id) + '">' +
                    '<div class="sev' + (iss.severity === "medium" ? " medium" : "") + '">' + escapeHtml(iss.severity === "high" ? "高" : "中") + " · " + escapeHtml(iss.service || iss.type || "") + "</div>" +
                    '<div class="ttl">' + escapeHtml(iss.title || iss.type) + "</div>" +
                    '<div class="desc">' + escapeHtml(extra) + "</div></button>";
            }).join("");
            box.querySelectorAll(".issue-card").forEach(function (btn) {
                btn.onclick = function () {
                    const rec = issues.filter(function (i) { return i.id === btn.getAttribute("data-id"); })[0];
                    const ids = (rec && rec.node_ids) || [];
                    const nid = ids.filter(function (id) { return id.indexOf("dp_") === 0; })[0] || ids[0];
                    if (nid) locateNode(nid, { focus: true });
                };
            });
            if (banner) {
                banner.classList.add("on");
                banner.innerHTML = "<strong>发现 " + issues.length + " 处不一致</strong><span>点击左侧卡片或图上红色标记定位到对应配置 / 服务。</span>";
            }
        }

        function updateIssuePins() {
            if (updateIssuePins._raf) return;
            updateIssuePins._raf = requestAnimationFrame(function () {
                updateIssuePins._raf = 0;
                const layer = $("issue-pins");
                if (!layer || !cy) return;
                layer.innerHTML = "";
                cy.nodes(".has-issue").forEach(function (n) {
                    if (n.style("display") === "none" || !n.visible()) return;
                    const issues = n.data("issues") || [];
                    const high = !issues.length || issues.some(function (i) { return i.severity === "high"; });
                    const rp = n.renderedPosition();
                    const pin = document.createElement("button");
                    pin.type = "button";
                    pin.className = "issue-pin" + (high ? "" : " medium");
                    pin.textContent = "!";
                    pin.title = (issues[0] && issues[0].title) || "不一致";
                    pin.style.left = rp.x + "px";
                    pin.style.top = rp.y + "px";
                    pin.onclick = function (evt) {
                        evt.stopPropagation();
                        locateNode(n.id(), { focus: true });
                    };
                    layer.appendChild(pin);
                });
            });
        }

        function updateStats() {
            if (!graphData) return;
            $("node-count").textContent = graphData.nodes.length;
            $("edge-count").textContent = graphData.edges.length;
            const issueN = ((graphData.issues || []).length) || cy.nodes(".has-issue").length;
            $("bad-count").textContent = issueN;
        }

        function fitGraph() {
            if (cy) cy.animate({ fit: { padding: 50 } }, { duration: 380, easing: "ease-out-cubic" });
        }
        function resetView() {
            $("layer-filter").value = "all";
            $("plane-filter").value = "all";
            if ($("ns-filter")) $("ns-filter").value = "all";
            $("inconsistent-only").checked = false;
            if ($("config-only")) $("config-only").checked = true;
            focusMode = false;
            pathMode = false;
            pathStart = null;
            $("path-btn").classList.remove("on");
            $("path-banner").classList.remove("on");
            $("search-input").value = "";
            $("search-drop").classList.remove("open");
            if (cy) {
                cy.nodes().style("display", "element");
                cy.edges().style("display", "element");
                clearHighlight();
                relayoutGraph();
            }
            clearSelection();
        }
        function exportPNG() {
            if (!cy) return;
            const link = document.createElement("a");
            link.href = cy.png({ full: true, scale: 2, bg: "#151515" });
            link.download = "three_layer_graph.png";
            link.click();
        }
        function toggleHelp() { $("help").classList.toggle("open"); }

        document.addEventListener("keydown", function (e) {
            const tag = (e.target && e.target.tagName) || "";
            const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
            if ((e.key === "/" || (e.key === "k" && (e.ctrlKey || e.metaKey))) && !typing) {
                e.preventDefault();
                $("search-input").focus();
                $("search-input").select();
                return;
            }
            if (typing) {
                if (e.key === "Escape") { e.target.blur(); $("search-drop").classList.remove("open"); }
                return;
            }
            if (e.key === "Escape") {
                if ($("help").classList.contains("open")) { toggleHelp(); return; }
                if (pathMode) { togglePathMode(); return; }
                clearSelection();
            }
            if (e.key === "f" || e.key === "F") fitGraph();
            if (e.key === "p" || e.key === "P") togglePathMode();
            if (e.key === "?" || e.key === "h" || e.key === "H") toggleHelp();
        });
    </script>
</body>
</html>
