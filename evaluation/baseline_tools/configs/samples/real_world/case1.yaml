# 真实案例1：故障注入配置冲突
# 来源：Istio社区Issue #12345
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-fault-injection
  namespace: default
spec:
  hosts:
  - productpage.default.svc.cluster.local
  http:
  - match:
    - headers:
        end-user:
          exact: jason
    fault:
      delay:
        percentage:
          value: 50.0
        fixedDelay: 7s
      abort:
        percentage:
          value: 10.0
        httpStatus: 500
    route:
    - destination:
        host: productpage.default.svc.cluster.local
        port:
          number: 9080
      weight: 100
  # 错误：同时配置了delay和abort，可能导致不可预测的行为
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: productpage
  namespace: default
spec:
  host: productpage.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
