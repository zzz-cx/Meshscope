# F10 Runtime policy enforcement gap — 100% abort always fails at runtime
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-f10
  namespace: default
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - fault:
      abort:
        httpStatus: 503
        percentage:
          value: 100
    route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 100
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-f10
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
