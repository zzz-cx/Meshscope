# F6 Retry omission in runtime — abort injected but retries omitted
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-f6
  namespace: default
  annotations:
    configpilot.intent/expect_retries: "true"
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - fault:
      abort:
        httpStatus: 503
        percentage:
          value: 30
    route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 100
    # retries intentionally omitted despite abort + intent
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-f6
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
