# F9 Incorrect routing dependency — route to non-existent host
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-f9
  namespace: default
spec:
  hosts:
  - productpage.default.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /api/v1/products
    route:
    - destination:
        host: non-existent-reviews.default.svc.cluster.local
        port:
          number: 9080
      weight: 100
  - route:
    - destination:
        host: productpage.default.svc.cluster.local
        port:
          number: 9080
      weight: 100
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: productpage-f9
  namespace: default
spec:
  host: productpage.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
