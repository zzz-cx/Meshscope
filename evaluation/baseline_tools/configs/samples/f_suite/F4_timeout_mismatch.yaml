# F4 Timeout mismatch — VS timeout far shorter than upstream SLO / DR idle
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-f4
  namespace: default
  annotations:
    configpilot.intent/slo_timeout: "2s"
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 100
    timeout: 10ms
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-f4
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        idleTimeout: 30s
  subsets:
  - name: v1
    labels:
      version: v1
