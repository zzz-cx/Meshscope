# L-Dynamic: valid 99/1 split that silently starves canary (intent vs measured)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-skewed-split
  namespace: default
  annotations:
    configpilot.intent/expected_split: "50/50"
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 99
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v2
      weight: 1
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-skewed-split
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
