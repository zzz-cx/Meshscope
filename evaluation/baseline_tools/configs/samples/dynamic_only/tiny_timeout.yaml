# L-Dynamic: extremely short timeout — schema OK, causes runtime timeouts
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-tiny-timeout
  namespace: default
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 100
    timeout: 1ms
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-tiny-timeout
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
