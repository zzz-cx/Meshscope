# L-Dynamic: valid retries that amplify load under faults (runtime latency/5xx)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-retry-storm
  namespace: default
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 100
    retries:
      attempts: 10
      perTryTimeout: 100ms
      retryOn: 5xx,reset,connect-failure,refused-stream,retriable-4xx
    timeout: 2s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-retry-storm
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
