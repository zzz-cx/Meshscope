apiVersion: v1
kind: Service
metadata:
  name: test-service-1
  namespace: default
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 9080
  selector:
    app: test-service-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-service-1
    version: v1
  name: test-service-1-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-service-1
      version: v1
  template:
    metadata:
      labels:
        app: test-service-1
        version: v1
    spec:
      containers:
      - env:
        - name: SERVICE_VERSION
          value: v1
        image: istio/examples-bookinfo-productpage-v1:latest
        name: test-service-1
        ports:
        - containerPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-service-1
    version: v2
  name: test-service-1-v2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-service-1
      version: v2
  template:
    metadata:
      labels:
        app: test-service-1
        version: v2
    spec:
      containers:
      - env:
        - name: SERVICE_VERSION
          value: v2
        image: istio/examples-bookinfo-productpage-v2:latest
        name: test-service-1
        ports:
        - containerPort: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-service-1
    version: v3
  name: test-service-1-v3
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-service-1
      version: v3
  template:
    metadata:
      labels:
        app: test-service-1
        version: v3
    spec:
      containers:
      - env:
        - name: SERVICE_VERSION
          value: v3
        image: istio/examples-bookinfo-productpage-v3:latest
        name: test-service-1
        ports:
        - containerPort: 9080
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: test-service-1
  namespace: default
spec:
  host: test-service-1
  subsets:
  - labels:
      version: v1
    name: v1
  - labels:
      version: v2
    name: v2
  - labels:
      version: v3
    name: v3
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: test-service-1
  namespace: default
spec:
  hosts:
  - test-service-1
  http:
  - route:
    - destination:
        host: test-service-1
        subset: v1
      weight: 50
    - destination:
        host: test-service-1
        subset: v2
      weight: 30
    - destination:
        host: test-service-1
        subset: v3
      weight: 20
---
