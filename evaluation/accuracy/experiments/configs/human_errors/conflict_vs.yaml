apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews
  namespace: default
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - match:
    - headers:
        end-user:
          exact: jason
    route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v2
      weight: 100
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 50
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v2
      weight: 50
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v3
      weight: 100  # 错误：权重总和为200%，超过100%
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - labels:
      version: v1
    name: v1
  - labels:
      version: v2
    name: v2
  - labels:
      version: v3
    name: v3
