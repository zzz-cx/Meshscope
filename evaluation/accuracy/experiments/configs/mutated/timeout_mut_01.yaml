# 变异配置3：超时时间配置过短
# 通过mutation生成：将超时时间从3s改为0.1s
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-timeout-mutated
  namespace: default
spec:
  hosts:
  - productpage.default.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /api/v1/products
    route:
    - destination:
        host: productpage.default.svc.cluster.local
        port:
          number: 9080
      weight: 100
    timeout: 0.1s  # 变异：超时时间过短，正常应该是3s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: productpage
  namespace: default
spec:
  host: productpage.default.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
