# Accuracy评估实验配置文件

# 实验基本信息
experiment:
  name: "accuracy_evaluation"
  version: "1.0"
  description: "Istio配置检测方法准确性评估实验"
  author: "Istio Consistency Checker Team"
  created_date: "2024-01-01"

# 环境配置
environment:
  cluster_config:
    # Kubernetes集群配置
    cluster_name: "istio-test-cluster"
    context: "default"
    namespace: "default"
    
    # 测试应用配置
    test_app: "bookinfo"
    ingress_url: "http://localhost:8080"
    
    # 资源配置
    cpu_limit: "2"
    memory_limit: "4Gi"
    
  monitoring:
    # Prometheus配置
    prometheus:
      enabled: true
      url: "http://localhost:9090"
      scrape_interval: "15s"
    
    # Jaeger配置
    jaeger:
      enabled: true
      url: "http://localhost:16686"
      sampling_rate: 0.1
    
    # Grafana配置
    grafana:
      enabled: true
      url: "http://localhost:3000"

# 检测方法配置
detection:
  # 静态检测配置
  static_analysis:
    enabled: true
    timeout: 60
    confidence_threshold: 0.7
    
  # 动态检测配置
  dynamic_analysis:
    enabled: true
    timeout: 300
    traffic_generation:
      qps: 5
      duration: 180
      concurrent_users: 3
      endpoints:
        - "/productpage"
        - "/api/v1/products"
        - "/reviews"
    
    behavior_analysis:
      anomaly_threshold: 0.15
      detection_algorithms:
        traffic_distribution:
          significance_level: 0.05
          chi_square_test: true
        error_rate:
          baseline_duration: 60
          anomaly_duration: 120
        latency:
          p95_threshold: 3000
          increase_factor: 1.5

# 混合检测配置
hybrid:
  result_fusion:
    static_weight: 0.4
    dynamic_weight: 0.6
    confidence_threshold: 0.7
    
  orthogonal_generation:
    enabled: true
    max_test_cases: 10
    optimization:
      deduplication: true
      priority_sorting: true
      coverage_optimization: true

# 现有工具配置
existing_tools:
  istioctl:
    enabled: true
    path: "istioctl"
    analyze_options:
      output_format: "json"
      include_warnings: true
      
  kube_linter:
    enabled: true
    path: "kube-linter"
    lint_options:
      format: "json"
      include_suggestions: true
      
  kubeval:
    enabled: true
    path: "kubeval"
    validate_options:
      output_format: "json"
      strict: false

# 评估配置
evaluation:
  metrics:
    # 主要指标
    primary_metrics:
      - "precision"
      - "recall"
      - "f1_score"
      - "accuracy"
    
    # 次要指标
    secondary_metrics:
      - "specificity"
      - "false_positive_rate"
      - "false_negative_rate"
      - "detection_time"
      - "resource_usage"
    
    # 置信度阈值
    confidence_threshold: 0.7
    
  statistical_analysis:
    # 统计检验配置
    significance_level: 0.05
    
    # 置信区间
    confidence_intervals:
      method: "bootstrap"
      confidence_level: 0.95
      n_bootstrap: 1000
    
    # 效应量
    effect_sizes:
      cohens_d: true
      interpretation_thresholds:
        small: 0.2
        medium: 0.5
        large: 0.8

# 数据收集配置
data_collection:
  # Prometheus指标
  prometheus_metrics:
    - "istio_requests_total"
    - "istio_request_duration_milliseconds"
    - "envoy_cluster_upstream_rq_retry"
    - "envoy_cluster_upstream_rq_timeout"
    - "envoy_http_ratelimit_rate_limited"
    - "envoy_cluster_upstream_ejections"
  
  # 日志收集
  log_collection:
    enabled: true
    log_levels:
      - "ERROR"
      - "WARN"
      - "INFO"
    retention_duration: "1h"
  
  # 事件收集
  event_collection:
    enabled: true
    event_types:
      - "Warning"
      - "Normal"
    retention_duration: "1h"

# 实验执行配置
execution:
  # 并发配置
  concurrency:
    max_concurrent_methods: 2
    max_concurrent_configs: 5
  
  # 超时配置
  timeouts:
    method_execution: 600  # 10分钟
    config_deployment: 120  # 2分钟
    data_collection: 300   # 5分钟
    cleanup: 60           # 1分钟
  
  # 重试配置
  retry:
    max_retries: 3
    retry_delay: 10
    exponential_backoff: true
  
  # 资源限制
  resource_limits:
    max_memory_usage: "8Gi"
    max_cpu_usage: "4"
    max_disk_usage: "10Gi"

# 输出配置
output:
  # 结果保存
  results:
    format: "json"
    include_raw_data: true
    include_statistics: true
    compression: false
  
  # 报告生成
  reports:
    formats:
      - "markdown"
      - "html"
    include_plots: true
    include_tables: true
    include_summary: true
  
  # 可视化配置
  visualization:
    enabled: true
    plot_types:
      - "bar_chart"
      - "line_chart"
      - "heatmap"
      - "roc_curve"
    output_format: "png"
    dpi: 300

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - type: "console"
      level: "INFO"
    - type: "file"
      level: "DEBUG"
      filename: "logs/accuracy_experiment.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5

# 安全配置
security:
  # 访问控制
  access_control:
    require_authentication: false
    allowed_users: []
  
  # 数据保护
  data_protection:
    encrypt_sensitive_data: false
    anonymize_logs: false
    retention_policy: "30d"

# 调试配置
debug:
  enabled: false
  verbose_output: false
  save_intermediate_results: false
  profile_performance: false
  memory_profiling: false
