# 不一致配置：权重总和不等于100%
apiVersion: v1
kind: List
items:
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: reviews-weight-error
    namespace: default
  spec:
    hosts:
    - reviews.default.svc.cluster.local
    http:
    - route:
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v1
        weight: 33
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v2
        weight: 33
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v3
        weight: 44  # 错误：总权重 = 33+33+44 = 110，不等于100

- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: reviews-weight-error
    namespace: default
  spec:
    host: reviews.default.svc.cluster.local
    subsets:
    - labels:
        version: v1
      name: v1
    - labels:
        version: v2
      name: v2
    - labels:
        version: v3
      name: v3
