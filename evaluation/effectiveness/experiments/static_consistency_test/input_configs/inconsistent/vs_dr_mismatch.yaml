# 不一致配置：VirtualService引用的subset在DestinationRule中不存在
apiVersion: v1
kind: List
items:
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: reviews-mismatch
    namespace: default
  spec:
    hosts:
    - reviews.default.svc.cluster.local
    http:
    - route:
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v1
        weight: 33
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v2  # 这个subset存在
        weight: 33
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v4  # 错误：这个subset在DestinationRule中不存在
        weight: 34

- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: reviews-mismatch
    namespace: default
  spec:
    host: reviews.default.svc.cluster.local
    subsets:
    - labels:
        version: v1
      name: v1
    - labels:
        version: v2
      name: v2
    - labels:
        version: v3
      name: v3
    # 注意：没有定义v4 subset，但VirtualService中引用了v4
