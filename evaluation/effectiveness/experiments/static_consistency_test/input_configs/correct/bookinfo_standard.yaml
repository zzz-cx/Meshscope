# 正确的Bookinfo配置示例
apiVersion: v1
kind: List
items:
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: bookinfo
    namespace: default
  spec:
    gateways:
    - bookinfo-gateway
    hosts:
    - productpage.bookinfo.com
    http:
    - match:
      - uri:
          exact: /productpage
      - uri:
          prefix: /static
      - uri:
          exact: /login
      - uri:
          exact: /logout
      - uri:
          prefix: /api/v1/products
      route:
      - destination:
          host: productpage
          port:
            number: 9080

- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: reviews
    namespace: default
  spec:
    hosts:
    - reviews.default.svc.cluster.local
    http:
    - route:
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v1
        weight: 50
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v3
        weight: 50

- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: reviews
    namespace: default
  spec:
    host: reviews.default.svc.cluster.local
    subsets:
    - labels:
        version: v1
      name: v1
    - labels:
        version: v3
      name: v3

- apiVersion: networking.istio.io/v1
  kind: Gateway
  metadata:
    name: bookinfo-gateway
    namespace: default
  spec:
    selector:
      istio: ingressgateway
    servers:
    - hosts:
      - '*'
      port:
        name: http
        number: 8080
        protocol: HTTP
