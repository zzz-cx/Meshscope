# 混合配置：包含部分正确和部分错误的配置
apiVersion: v1
kind: List
items:
# 正确的Gateway配置
- apiVersion: networking.istio.io/v1
  kind: Gateway
  metadata:
    name: bookinfo-gateway
    namespace: default
  spec:
    selector:
      istio: ingressgateway  # 正确的选择器
    servers:
    - hosts:
      - '*'
      port:
        name: http
        number: 8080
        protocol: HTTP

# 正确的VirtualService配置
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: bookinfo
    namespace: default
  spec:
    gateways:
    - bookinfo-gateway
    hosts:
    - productpage.bookinfo.com
    http:
    - match:
      - uri:
          exact: /productpage
      route:
      - destination:
          host: productpage
          port:
            number: 9080

# 错误的VirtualService配置 - 权重不正确
- apiVersion: networking.istio.io/v1
  kind: VirtualService
  metadata:
    name: reviews-mixed
    namespace: default
  spec:
    hosts:
    - reviews.default.svc.cluster.local
    http:
    - route:
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v1
        weight: 60
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v2
        weight: 30
      - destination:
          host: reviews.default.svc.cluster.local
          subset: v3
        weight: 20  # 错误：总权重 = 60+30+20 = 110

# 部分正确的DestinationRule配置
- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: reviews-mixed
    namespace: default
  spec:
    host: reviews.default.svc.cluster.local
    subsets:
    - labels:
        version: v1
      name: v1
    - labels:
        version: v2
      name: v2
    # 错误：缺少v3 subset定义，但VirtualService中引用了v3

# 错误的DestinationRule配置 - 引用不存在的服务
- apiVersion: networking.istio.io/v1
  kind: DestinationRule
  metadata:
    name: ratings-mixed
    namespace: default
  spec:
    host: ratings-nonexistent.default.svc.cluster.local  # 错误：服务不存在
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 10
