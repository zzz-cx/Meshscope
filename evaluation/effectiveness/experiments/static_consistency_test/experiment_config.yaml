# 静态一致性检验实验配置

experiment:
  name: "Static Consistency Verification"
  version: "1.0"
  description: "验证系统静态分析检测配置不一致性的能力"

# 实验环境配置
environment:
  target_system: "istio_consistency_checker"
  analysis_mode: "static"
  timeout: 300  # 5分钟超时
  
# 测试用例配置
test_cases:
  # 正确配置基准测试
  correct_configs:
    - name: "bookinfo_standard"
      description: "标准Bookinfo配置"
      config_files: 
        - "correct/bookinfo_vs.yaml"
        - "correct/bookinfo_dr.yaml"
        - "correct/bookinfo_gateway.yaml"
      expected_issues: 0
      
    - name: "online_boutique_standard"
      description: "标准Online Boutique配置"
      config_files:
        - "correct/online_boutique_configs.yaml"
      expected_issues: 0

  # 不一致配置测试
  inconsistent_configs:
    - name: "vs_dr_mismatch"
      description: "VirtualService与DestinationRule subset不匹配"
      config_files:
        - "inconsistent/vs_dr_mismatch.yaml"
      expected_issues: 1
      issue_types: ["subset_reference_error"]
      severity: "high"
      
    - name: "weight_sum_error"
      description: "权重总和不等于100%"
      config_files:
        - "inconsistent/weight_error.yaml"
      expected_issues: 1
      issue_types: ["weight_allocation_error"]
      severity: "medium"
      
    - name: "duplicate_envoyfilter"
      description: "重复EnvoyFilter配置冲突"
      config_files:
        - "inconsistent/duplicate_envoyfilter.yaml"
      expected_issues: 1
      issue_types: ["policy_conflict"]
      severity: "high"
      
    - name: "service_reference_error"
      description: "引用不存在的服务"
      config_files:
        - "inconsistent/missing_service_ref.yaml"
      expected_issues: 1
      issue_types: ["service_reference_error"]
      severity: "high"
      
    - name: "gateway_selector_error"
      description: "Gateway选择器错误"
      config_files:
        - "inconsistent/gateway_selector_error.yaml"
      expected_issues: 1
      issue_types: ["selector_mismatch"]
      severity: "medium"

  # 混合配置测试  
  mixed_configs:
    - name: "partial_inconsistency"
      description: "部分配置有问题的混合场景"
      config_files:
        - "mixed/bookinfo_with_errors.yaml"
        - "mixed/online_boutique_partial.yaml"
      expected_issues: 3
      issue_types: ["subset_reference_error", "weight_allocation_error", "policy_conflict"]

# 检测器配置
detector_config:
  # 启用的检测器
  enabled_detectors:
    - "subset_reference_checker"
    - "weight_allocation_checker"  
    - "service_reference_checker"
    - "gateway_selector_checker"
    - "policy_conflict_checker"
    - "duplicate_definition_checker"
    
  # 检测严格程度
  strictness_level: "medium"  # low, medium, high
  
  # 输出配置
  output_format: "json"  # json, yaml, text
  include_suggestions: true
  generate_graph: true

# 评价指标配置
evaluation_metrics:
  # 主要指标
  primary_metrics:
    - "detection_rate"      # 检测率
    - "false_positive_rate" # 误报率
    - "false_negative_rate" # 漏报率
    - "precision"           # 精确度
    - "recall"              # 召回率
    - "f1_score"            # F1分数
    
  # 性能指标
  performance_metrics:
    - "analysis_time"       # 分析时间
    - "memory_usage"        # 内存使用
    - "cpu_usage"           # CPU使用
    
  # 覆盖率指标
  coverage_metrics:
    - "issue_type_coverage" # 问题类型覆盖率
    - "config_type_coverage" # 配置类型覆盖率

# 报告配置
reporting:
  generate_summary: true
  include_visualizations: true
  export_formats: ["json", "html", "pdf"]
  
  # 图表配置
  visualization:
    dependency_graph: true
    issue_distribution: true
    severity_breakdown: true
    detection_timeline: true

# 验证配置
validation:
  # 结果验证方式
  validation_methods:
    - "ground_truth_comparison"  # 与预期结果对比
    - "expert_review"           # 专家评审
    - "cross_validation"        # 交叉验证
    
  # 允许的误差范围
  tolerance:
    detection_rate: 0.05     # 5%误差
    false_positive_rate: 0.02 # 2%误差
    
  # 最低接受标准
  acceptance_criteria:
    min_detection_rate: 0.85
    max_false_positive_rate: 0.10
    max_analysis_time: 60    # 60秒
