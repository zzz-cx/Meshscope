# 限流测试场景：每分钟最多3个请求
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: adservice-rate-limit-test
  namespace: online-boutique
  labels:
    experiment: "dynamic_consistency_test"
    scenario: "rate_limiting_failure"
spec:
  workloadSelector:
    labels:
      app: adservice
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: http_local_rate_limiter
          token_bucket:
            max_tokens: 3
            tokens_per_fill: 3
            fill_interval: 60s  # 每分钟3个请求
          filter_enabled:
            default_value:
              numerator: 100
              denominator: HUNDRED
          filter_enforced:
            default_value:
              numerator: 100
              denominator: HUNDRED
          response_headers_to_add:
            - header:
                key: "x-rate-limit-test"
                value: "3 requests per minute"
