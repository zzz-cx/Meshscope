# 故障注入测试场景：30%延迟2秒，10%返回503错误
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-fault-injection
  namespace: default
  labels:
    experiment: "dynamic_consistency_test"
    scenario: "fault_injection_failure"
spec:
  hosts:
  - productpage.default.svc.cluster.local
  http:
  - fault:
      delay:
        percentage:
          value: 30.0
        fixedDelay: 2s
      abort:
        percentage:
          value: 10.0
        httpStatus: 503
    route:
    - destination:
        host: productpage.default.svc.cluster.local
        port:
          number: 9080
