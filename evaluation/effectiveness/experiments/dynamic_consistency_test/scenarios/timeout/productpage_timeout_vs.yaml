# 超时策略测试场景：请求超时3秒
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productpage-timeout-test
  namespace: default
  labels:
    experiment: "dynamic_consistency_test"
    scenario: "timeout_policy_failure"
spec:
  hosts:
  - productpage.default.svc.cluster.local
  http:
  - timeout: 3s
    route:
    - destination:
        host: productpage.default.svc.cluster.local
        port:
          number: 9080
