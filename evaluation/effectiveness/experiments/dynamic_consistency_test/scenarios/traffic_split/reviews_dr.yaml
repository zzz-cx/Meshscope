# Reviews服务的DestinationRule定义
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews-destination-rule
  namespace: default
  labels:
    experiment: "dynamic_consistency_test"
    scenario: "traffic_split_anomaly"
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
  - name: v3
    labels:
      version: v3
