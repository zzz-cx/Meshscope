# 流量分发测试场景：70% v1, 30% v3
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews-traffic-split
  namespace: default
  labels:
    experiment: "dynamic_consistency_test"
    scenario: "traffic_split_anomaly"
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 70
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v3
      weight: 30
