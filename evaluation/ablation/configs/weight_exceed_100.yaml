# 测试用例: 权重之和 > 100%
# v1:70 + v2:80 = 150%
# 预期: 静态检测应发现权重超出100；动态检测应发现流量分配异常
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: reviews
  namespace: default
spec:
  hosts:
  - reviews.default.svc.cluster.local
  http:
  - route:
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v1
      weight: 70
    - destination:
        host: reviews.default.svc.cluster.local
        subset: v2
      weight: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: reviews
  namespace: default
spec:
  host: reviews.default.svc.cluster.local
  subsets:
  - labels:
      version: v1
    name: v1
  - labels:
      version: v2
    name: v2
