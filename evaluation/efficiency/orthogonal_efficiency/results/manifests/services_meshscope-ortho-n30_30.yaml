apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: meshscope-gw
  namespace: meshscope-ortho-n30
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - '*'
    port:
      name: http
      number: 80
      protocol: HTTP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: meshscope-svc-0001
    meshscope/exp: real-traffic
  name: meshscope-svc-0001
  namespace: meshscope-ortho-n30
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  selector:
    app: meshscope-svc-0001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meshscope-svc-0001
    meshscope/exp: real-traffic
    version: v1
  name: meshscope-svc-0001-v1
  namespace: meshscope-ortho-n30
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshscope-svc-0001
      version: v1
  template:
    metadata:
      annotations: {}
      labels:
        app: meshscope-svc-0001
        meshscope/exp: real-traffic
        version: v1
    spec:
      containers:
      - image: docker.m.daocloud.io/library/nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: meshscope-svc-0001
    meshscope/exp: real-traffic
    version: v2
  name: meshscope-svc-0001-v2
  namespace: meshscope-ortho-n30
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshscope-svc-0001
      version: v2
  template:
    metadata:
      annotations: {}
      labels:
        app: meshscope-svc-0001
        meshscope/exp: real-traffic
        version: v2
    spec:
      containers:
      - image: docker.m.daocloud.io/library/nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  labels:
    meshscope/exp: real-traffic
  name: meshscope-svc-0001
  namespace: meshscope-ortho-n30
spec:
  host: meshscope-svc-0001
  subsets:
  - labels:
      version: v1
    name: v1
  - labels:
      version: v2
    name: v2
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
---
