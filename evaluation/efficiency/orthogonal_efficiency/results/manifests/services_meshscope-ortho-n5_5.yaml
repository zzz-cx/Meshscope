apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    meshscope/exp: real-traffic
  name: meshscope-ingress
  namespace: meshscope-ortho-n5
spec:
  gateways:
  - meshscope-gw
  hosts:
  - '*'
  http:
  - match:
    - uri:
        exact: /s1/
    - uri:
        exact: /s1
    rewrite:
      uri: /
    route:
    - destination:
        host: meshscope-svc-0001
        port:
          number: 80
        subset: v1
  - match:
    - uri:
        exact: /s2/
    - uri:
        exact: /s2
    rewrite:
      uri: /
    route:
    - destination:
        host: meshscope-svc-0002
        port:
          number: 80
        subset: v1
  - match:
    - uri:
        exact: /s3/
    - uri:
        exact: /s3
    rewrite:
      uri: /
    route:
    - destination:
        host: meshscope-svc-0003
        port:
          number: 80
        subset: v1
  - match:
    - uri:
        exact: /s4/
    - uri:
        exact: /s4
    rewrite:
      uri: /
    route:
    - destination:
        host: meshscope-svc-0004
        port:
          number: 80
        subset: v1
  - match:
    - uri:
        exact: /s5/
    - uri:
        exact: /s5
    rewrite:
      uri: /
    route:
    - destination:
        host: meshscope-svc-0005
        port:
          number: 80
        subset: v1
