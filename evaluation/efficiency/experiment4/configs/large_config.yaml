# 大规模配置样本 - 用于效率评估
# 包含复杂的微服务架构和多种策略组合
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: default
spec:
  selector:
    app: product-catalog
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: default
spec:
  selector:
    app: cart-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: default
spec:
  selector:
    app: checkout-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: default
spec:
  selector:
    app: payment-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: default
spec:
  selector:
    app: shipping-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
spec:
  selector:
    app: user-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: default
spec:
  selector:
    app: recommendation-service
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: frontend
  namespace: default
spec:
  hosts:
  - frontend
  gateways:
  - frontend-gateway
  http:
  - match:
    - headers:
        x-user-role:
          exact: admin
      uri:
        prefix: /admin
    route:
    - destination:
        host: frontend
        port:
          number: 8080
  - match:
    - headers:
        x-user-role:
          exact: premium
      uri:
        prefix: /premium
    route:
    - destination:
        host: frontend
        port:
          number: 8080
  - match:
    - headers:
        x-device-type:
          exact: mobile
      uri:
        prefix: /mobile
    route:
    - destination:
        host: frontend
        port:
          number: 8080
  - route:
    - destination:
        host: frontend
        port:
          number: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: product-catalog
  namespace: default
spec:
  hosts:
  - product-catalog
  http:
  - match:
    - headers:
        x-region:
          exact: us-east
      uri:
        prefix: /products
    route:
    - destination:
        host: product-catalog
        subset: us-east
      weight: 100
  - match:
    - headers:
        x-region:
          exact: us-west
      uri:
        prefix: /products
    route:
    - destination:
        host: product-catalog
        subset: us-west
      weight: 100
  - match:
    - headers:
        x-cache-control:
          exact: no-cache
      uri:
        prefix: /products
    route:
    - destination:
        host: product-catalog
        subset: cache-disabled
      weight: 100
  - route:
    - destination:
        host: product-catalog
        subset: default
      weight: 90
    - destination:
        host: product-catalog
        subset: backup
      weight: 10
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: cart-service
  namespace: default
spec:
  hosts:
  - cart-service
  http:
  - match:
    - headers:
        x-user-tier:
          exact: vip
    route:
    - destination:
        host: cart-service
        subset: vip
      weight: 100
  - match:
    - headers:
        x-user-tier:
          exact: standard
    route:
    - destination:
        host: cart-service
        subset: standard
      weight: 100
  - route:
    - destination:
        host: cart-service
        subset: default
      weight: 100
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: checkout-service
  namespace: default
spec:
  hosts:
  - checkout-service
  http:
  - match:
    - headers:
        x-payment-method:
          exact: credit-card
    route:
    - destination:
        host: checkout-service
        subset: credit-card
      weight: 100
  - match:
    - headers:
        x-payment-method:
          exact: paypal
    route:
    - destination:
        host: checkout-service
        subset: paypal
      weight: 100
  - route:
    - destination:
        host: checkout-service
        subset: default
      weight: 100
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: frontend
  namespace: default
spec:
  host: frontend
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: product-catalog
  namespace: default
spec:
  host: product-catalog
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 3
  subsets:
  - name: us-east
    labels:
      region: us-east
  - name: us-west
    labels:
      region: us-west
  - name: default
    labels:
      region: default
  - name: backup
    labels:
      region: backup
  - name: cache-disabled
    labels:
      cache: disabled
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: cart-service
  namespace: default
spec:
  host: cart-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 150
      http:
        http1MaxPendingRequests: 75
        maxRequestsPerConnection: 2
  subsets:
  - name: vip
    labels:
      tier: vip
  - name: standard
    labels:
      tier: standard
  - name: default
    labels:
      tier: default
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: frontend-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
