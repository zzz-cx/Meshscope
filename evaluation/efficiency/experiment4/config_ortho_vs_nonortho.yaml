# 正交 vs 非正交覆盖率对比（精简配置，便于快速跑通）
experiment:
  name: "orthogonal_vs_nonorthogonal_coverage"
  description: "对比正交与非正交（穷举/配对/随机）测试用例生成的覆盖率差异"
  iterations: 1

# 正交 + 三类非正交基线
methods:
  - "orthogonal"
  - "exhaustive"
  - "pairwise"
  - "random"

configs:
  small: "configs/small_config.yaml"
  medium: "configs/medium_config.yaml"
  large: "configs/large_config.yaml"

parameters:
  exhaustive:
    max_cases: 200
    config_scale: "small"
  orthogonal:
    max_cases: 100
    config_scale: "medium"
    orthogonal_principles:
      - "match_conditions"
      - "function_policies"
      - "global_local"
      - "trigger_mechanisms"
  pairwise:
    max_cases: 50
    config_scale: "medium"
  random:
    num_cases: 30
    num_runs: 3
    config_scale: "medium"
    seed: 42

coverage:
  path_types:
    - "header_match"
    - "uri_match"
    - "route_destination"
    - "load_balancing"
    - "connection_pool"
    - "outlier_detection"
    - "subset_config"
    - "gateway_host"
  importance_weights:
    high: 1.0
    medium: 0.7
    low: 0.5

cost_analysis:
  resource_monitoring:
    enabled: false
    sampling_interval: 0.5
    metrics:
      - "cpu_usage"
      - "memory_usage"
  cost_factors:
    cpu_weight: 0.3
    memory_weight: 0.3
    network_weight: 0.2
    storage_weight: 0.2
  efficiency_metrics:
    - "coverage_per_time"
    - "test_cases_per_time"
    - "cost_per_coverage"

statistical_testing:
  significance_level: 0.05
  tests:
    - "wilcoxon"
  bootstrap:
    iterations: 200
    confidence_level: 0.95

sensitivity_analysis:
  orthogonal_values:
    variations: [0.8, 1.0, 1.2]
  t_way_coverage:
    values: [2, 3]
  scale_factors:
    small: 0.5
    medium: 1.0
    large: 2.0

scale_sensitivity:
  configurations:
    small:
      services: 5
      virtual_services: 3
      destination_rules: 2
      gateways: 1
    medium:
      services: 10
      virtual_services: 6
      destination_rules: 4
      gateways: 2
    large:
      services: 20
      virtual_services: 12
      destination_rules: 8
      gateways: 4

output:
  results_dir: "results"
  visualizations: false
  export_formats:
    - "json"

integration:
  istio_dynamic_test:
    enabled: false
    path: "../../istio_Dynamic_Test"

logging:
  level: "INFO"
  console: true

performance:
  max_parallel_methods: 1
  timeout_per_method: 1800
