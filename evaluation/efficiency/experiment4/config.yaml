# 实验四配置文件：效率评估实验
experiment:
  name: "efficiency_evaluation"
  description: "测试用例生成方法效率评估实验"
  iterations: 1  # 重复实验次数

# 测试方法配置
methods:
  - "exhaustive"    # 穷举方法
  - "orthogonal"    # 正交方法（我们的方法）
  - "pairwise"      # 配对方法
  - "random"        # 随机方法
  - "manual"        # 手动方法（可选）

# 配置文件路径
configs:
  small: "configs/small_config.yaml"
  medium: "configs/medium_config.yaml"
  large: "configs/large_config.yaml"

# 各方法参数配置
parameters:
  exhaustive:
    max_cases: 1000
    config_scale: "small"  # 小规模配置
    
  orthogonal:
    max_cases: 100
    config_scale: "medium"  # 中等规模配置
    orthogonal_principles:
      - "match_conditions"
      - "function_policies"
      - "global_local"
      - "trigger_mechanisms"
    
  pairwise:
    max_cases: 50
    config_scale: "medium"
    
  random:
    num_cases: 30
    num_runs: 5  # 多次随机运行
    config_scale: "medium"
    seed: 42
    
  manual:
    test_cases_file: "manual_test_cases.json"
    config_scale: "medium"

# 覆盖率计算配置
coverage:
  path_types:
    - "header_match"
    - "uri_match"
    - "route_destination"
    - "load_balancing"
    - "connection_pool"
    - "outlier_detection"
    - "subset_config"
    - "gateway_host"
  
  importance_weights:
    high: 1.0      # 重要性 >= 0.8
    medium: 0.7    # 重要性 0.5-0.8
    low: 0.5       # 重要性 < 0.5

# 成本与效率分析配置
cost_analysis:
  resource_monitoring:
    enabled: true
    sampling_interval: 0.5  # 秒
    metrics:
      - "cpu_usage"
      - "memory_usage"
      - "network_traffic"
      - "storage_usage"
  
  cost_factors:
    cpu_weight: 0.3
    memory_weight: 0.3
    network_weight: 0.2
    storage_weight: 0.2
  
  efficiency_metrics:
    - "coverage_per_time"
    - "test_cases_per_time"
    - "cost_per_coverage"
    - "scalability_score"

# 统计测试配置
statistical_testing:
  significance_level: 0.05
  tests:
    - "wilcoxon"    # Wilcoxon符号秩检验
    - "mcnemar"     # McNemar检验
    - "bootstrap"   # Bootstrap置信区间
  
  bootstrap:
    iterations: 1000
    confidence_level: 0.95

# 敏感性分析配置
sensitivity_analysis:
  orthogonal_values:
    variations: [0.5, 0.8, 1.2, 1.5, 2.0]
  
  t_way_coverage:
    values: [2, 3, 4, 5]
  
  scale_factors:
    small: 0.5
    medium: 1.0
    large: 2.0

# 规模敏感性配置
scale_sensitivity:
  configurations:
    small:
      services: 5
      virtual_services: 3
      destination_rules: 2
      gateways: 1
    
    medium:
      services: 10
      virtual_services: 6
      destination_rules: 4
      gateways: 2
    
    large:
      services: 20
      virtual_services: 12
      destination_rules: 8
      gateways: 4

# 输出配置
output:
  results_dir: "results"
  visualizations: true
  export_formats:
    - "json"
    - "csv"
    - "html"
  
  visualizations:
    coverage_vs_test_cases: true
    test_case_counts_bar: true
    cost_coverage_efficiency_scatter: true
    execution_time_boxplot: true
    coverage_comparison_radar: true
    efficiency_ranking: true
  
  report_sections:
    - "executive_summary"
    - "method_comparison"
    - "coverage_analysis"
    - "cost_analysis"
    - "efficiency_analysis"
    - "statistical_results"
    - "sensitivity_analysis"
    - "recommendations"

# 集成配置
integration:
  istio_dynamic_test:
    enabled: true
    path: "../../istio_Dynamic_Test"
    orthogonal_handler: "checker/orthogonal_handler.py"
  
  src_istio_monitor:
    enabled: true
    path: "../../src/istio_monitor"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "experiment4.log"
  console: true

# 性能配置
performance:
  max_parallel_methods: 2  # 最大并行执行方法数
  timeout_per_method: 3600  # 每个方法超时时间（秒）
  memory_limit: "2GB"      # 内存限制
  cpu_limit: 4             # CPU限制
