  namespace: meshscope-demo
spec:
  host: catalog
  subsets:
  - name: v1
    labels:
      version: v1
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: checkout
  namespace: meshscope-demo
spec:
  host: checkout
  subsets:
  - name: v1
    labels:
      version: v1
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
# 挂到现有 Ingress 8080 监听（default/bookinfo-gateway），路径与残留 /productpage 错开
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: demo-ingress
  namespace: meshscope-demo
spec:
  hosts:
  - "*"
  gateways:
  - default/bookinfo-gateway
  http:
  - match:
    - uri:
        prefix: /demo/productpage
      headers:
        end-user:
          exact: jason
    route:
    - destination:
        host: productpage
        subset: v1
        port:
          number: 9080
  - match:
    - uri:
        prefix: /demo/productpage
    route:
    - destination:
        host: productpage
        subset: v1
        port:
          number: 9080
      weight: 20
    - destination:
        host: productpage
        subset: v2
        port:
          number: 9080
      weight: 80
  - match:
    - uri:
        prefix: /demo/reviews
    route:
    - destination:
        host: reviews
        subset: v1
        port:
          number: 9080
      weight: 70
    - destination:
        host: reviews
        subset: v2
        port:
          number: 9080
      weight: 30
  - match:
    - uri:
        prefix: /demo/catalog
    timeout: 3s
    retries:
      attempts: 3
      perTryTimeout: 1s
      retryOn: 5xx,connect-failure,refused-stream
    route:
    - destination:
        host: catalog
        subset: v1
        port:
          number: 9080
  - match:
    - uri:
        prefix: /demo/checkout
    route:
    - destination:
        host: checkout
        subset: v1
        port:
          number: 9080
  - match:
    - uri:
        prefix: /demo/fault
    fault:
      abort:
        httpStatus: 503
        percentage:
          value: 100
    route:
    - destination:
        host: productpage
        subset: v1
        port:
          number: 9080
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: meshscope-demo
spec:
  hosts:
  - reviews
  http:
  - route:
    - destination:
        host: reviews
        subset: v1
      weight: 70
    - destination:
        host: reviews
        subset: v2
      weight: 30
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: productpage-local-ratelimit
  namespace: meshscope-demo
spec:
  workloadSelector:
    labels:
      app: productpage
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          stat_prefix: productpage_http_local_rl
          token_bucket:
            max_tokens: 8
            tokens_per_fill: 8
            fill_interval: 1s
