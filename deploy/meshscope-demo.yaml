# 现网可 kubectl get 到的演示网格：多服务 + VS/DR/超时/重试/熔断/故障注入
# kubectl apply -f deploy/meshscope-demo.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: meshscope-demo
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: productpage
  namespace: meshscope-demo
  labels:
    app: productpage
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 8080
  selector:
    app: productpage
---
apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: meshscope-demo
  labels:
    app: reviews
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 8080
  selector:
    app: reviews
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: meshscope-demo
  labels:
    app: catalog
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 8080
  selector:
    app: catalog
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: meshscope-demo
  labels:
    app: checkout
spec:
  ports:
  - name: http
    port: 9080
    targetPort: 8080
  selector:
    app: checkout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  namespace: meshscope-demo
  labels:
    app: productpage
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      labels:
        app: productpage
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: http
        image: hashicorp/http-echo:0.2.3
        imagePullPolicy: IfNotPresent
        args: ["-listen=:8080", "-text=productpage-v1"]
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v2
  namespace: meshscope-demo
  labels:
    app: productpage
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v2
  template:
    metadata:
      labels:
        app: productpage
        version: v2
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
